<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">
    Cost vs Quality: DeepSeek V4.1 Flash vs Competitors
  </text>
  
  <!-- Grid -->
  <line x1="80" y1="70" x2="80" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="520" x2="750" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Grid lines -->
  <line x1="80" y1="430" x2="750" y2="430" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="340" x2="750" y2="340" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="250" x2="750" y2="250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="160" x2="750" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="70" x2="750" y2="70" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Y-axis labels (GPQA scores) -->
  <text x="65" y="525" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">84</text>
  <text x="65" y="435" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">86</text>
  <text x="65" y="345" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">88</text>
  <text x="65" y="255" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">90</text>
  <text x="65" y="165" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">92</text>
  <text x="65" y="75" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">94</text>
  
  <!-- X-axis labels (cost) -->
  <text x="80" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">$0</text>
  <text x="214" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">$5</text>
  <text x="348" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">$10</text>
  <text x="482" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">$15</text>
  <text x="616" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">$20</text>
  <text x="750" y="545" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">$25</text>
  
  <!-- "Best Value Zone" box -->
  <rect x="80" y="220" width="150" height="120" fill="#dbeafe" opacity="0.3" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="155" y="210" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2563eb">Best Value Zone</text>
  
  <!-- Data points -->
  
  <!-- GLM-5.3 Flash -->
  <circle cx="100" cy="236" r="10" fill="#10b981"/>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#10b981">GLM-5.3</text>
  <text x="100" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">$0.50 / 91.0</text>
  
  <!-- DeepSeek V4.1 Flash -->
  <circle cx="110" cy="246" r="12" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="280" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#ef4444">V4.1 Flash</text>
  <text x="110" y="292" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">$0.60 / 90.9</text>
  
  <!-- DeepSeek V4 Pro (retired) -->
  <circle cx="130" cy="248" r="9" fill="#94a3b8"/>
  <line x1="120" y1="240" x2="140" y2="256" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="240" x2="120" y2="256" stroke="#475569" stroke-width="2"/>
  <text x="130" y="307" text-anchor="middle" font-family="Arial" font-size="9" fill="#64748b">V4 Pro (retired)</text>
  <text x="130" y="318" text-anchor="middle" font-family="Arial" font-size="8" fill="#64748b">$1.98 / 90.1</text>
  
  <!-- Gemini 3.7 Flash -->
  <circle cx="180" cy="374" r="9" fill="#f59e0b"/>
  <text x="180" y="395" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">Gemini 3.7</text>
  <text x="180" y="405" text-anchor="middle" font-family="Arial" font-size="8" fill="#475569">$3.75 / 85.8</text>
  
  <!-- GPT-5.6 Terra -->
  <circle cx="482" cy="185" r="9" fill="#8b5cf6"/>
  <text x="482" y="205" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">GPT-5.6</text>
  <text x="482" y="215" text-anchor="middle" font-family="Arial" font-size="8" fill="#475569">$15 / 93.0</text>
  
  <!-- Claude Opus 4.8 -->
  <circle cx="670" cy="236" r="9" fill="#a855f7"/>
  <text x="670" y="223" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">Opus 4.8</text>
  <text x="670" y="258" text-anchor="middle" font-family="Arial" font-size="8" fill="#475569">$25 / 91.3</text>
  
  <!-- Kimi K3 -->
  <circle cx="482" cy="252" r="8" fill="#ec4899"/>
  <text x="482" y="273" text-anchor="middle" font-family="Arial" font-size="9" fill="#475569">Kimi K3</text>
  <text x="482" y="283" text-anchor="middle" font-family="Arial" font-size="8" fill="#475569">$15 / 90.5</text>
  
  <!-- Axis labels -->
  <text x="415" y="575" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#475569">
    Output Cost per 1M Tokens (USD)
  </text>
  
  <text x="30" y="295" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#475569" transform="rotate(-90 30 295)">
    GPQA Diamond Score
  </text>
  
  <!-- Legend -->
  <rect x="550" y="80" width="220" height="140" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5"/>
  <text x="660" y="100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">Legend</text>
  
  <circle cx="570" cy="120" r="7" fill="#ef4444"/>
  <text x="585" y="125" font-family="Arial" font-size="11" fill="#475569">DeepSeek V4.1 Flash</text>
  
  <circle cx="570" cy="145" r="6" fill="#10b981"/>
  <text x="585" y="150" font-family="Arial" font-size="11" fill="#475569">Chinese Flash Models</text>
  
  <circle cx="570" cy="170" r="6" fill="#8b5cf6"/>
  <text x="585" y="175" font-family="Arial" font-size="11" fill="#475569">Western Closed Models</text>
  
  <circle cx="570" cy="195" r="6" fill="#94a3b8"/>
  <line x1="563" y1="188" x2="577" y2="202" stroke="#475569" stroke-width="1.5"/>
  <line x1="577" y1="188" x2="563" y2="202" stroke="#475569" stroke-width="1.5"/>
  <text x="585" y="200" font-family="Arial" font-size="11" fill="#475569">Retired Models</text>
</svg>