<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">
    DeepSeek V4 Flash vs V4.1 Flash: Benchmark Comparison
  </text>
  
  <!-- Grid lines -->
  <line x1="100" y1="80" x2="100" y2="450" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="450" x2="750" y2="450" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="80" y="450" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">0</text>
  <text x="80" y="358" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">25</text>
  <text x="80" y="266" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">50</text>
  <text x="80" y="174" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">75</text>
  <text x="80" y="82" text-anchor="end" font-family="Arial" font-size="12" fill="#475569">100</text>
  
  <!-- Grid horizontal lines -->
  <line x1="100" y1="358" x2="750" y2="358" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="266" x2="750" y2="266" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="174" x2="750" y2="174" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="82" x2="750" y2="82" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Bars for GPQA Diamond -->
  <rect x="130" y="124" width="40" height="326" fill="#94a3b8"/>
  <rect x="180" y="113" width="40" height="337" fill="#2563eb"/>
  <text x="150" y="475" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">GPQA</text>
  <text x="150" y="110" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">88.1</text>
  <text x="200" y="100" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb">90.9</text>
  
  <!-- Bars for HLE w/tools -->
  <rect x="260" y="280" width="40" height="170" fill="#94a3b8"/>
  <rect x="310" y="194" width="40" height="256" fill="#2563eb"/>
  <text x="285" y="475" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">HLE w/tools</text>
  <text x="280" y="268" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">45.1</text>
  <text x="330" y="182" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb">63.9</text>
  
  <!-- Bars for DeepSWE -->
  <rect x="390" y="232" width="40" height="218" fill="#94a3b8"/>
  <rect x="440" y="180" width="40" height="270" fill="#2563eb"/>
  <text x="415" y="475" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">DeepSWE</text>
  <text x="410" y="220" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">59.3</text>
  <text x="460" y="168" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb">74.2</text>
  
  <!-- Bars for Terminal-Bench 2.1 -->
  <rect x="520" y="142" width="40" height="308" fill="#94a3b8"/>
  <rect x="570" y="117" width="40" height="333" fill="#2563eb"/>
  <text x="545" y="475" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">Terminal 2.1</text>
  <text x="540" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">83.9</text>
  <text x="590" y="105" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb">90.6</text>
  
  <!-- Bars for MathArena -->
  <rect x="650" y="329" width="40" height="121" fill="#94a3b8"/>
  <rect x="700" y="210" width="40" height="240" fill="#2563eb"/>
  <text x="675" y="475" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">MathArena</text>
  <text x="670" y="318" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">33.0</text>
  <text x="720" y="198" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2563eb">65.6</text>
  
  <!-- Legend -->
  <rect x="250" y="55" width="20" height="15" fill="#94a3b8"/>
  <text x="275" y="66" font-family="Arial" font-size="12" fill="#475569">V4 Flash</text>
  <rect x="360" y="55" width="20" height="15" fill="#2563eb"/>
  <text x="385" y="66" font-family="Arial" font-size="12" fill="#475569">V4.1 Flash</text>
  
  <!-- Y-axis label -->
  <text x="30" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#475569" transform="rotate(-90 30 265)">
    Score (%)
  </text>
</svg>