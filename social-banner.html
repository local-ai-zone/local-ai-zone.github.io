<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>Local AI Zone - Social Media Banner</title>
    <link rel="stylesheet" href="css/social-banner.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="banner-container">
        <!-- Background Elements -->
        <div class="background-gradient"></div>
        <div class="background-pattern"></div>
        
        <!-- Main Content -->
        <div class="banner-content">
            <!-- Header Section -->
            <header class="banner-header">
                <div class="brand-section">
                    <div class="logo-container">
                        <div class="logo-icon">⚡</div>
                    </div>
                    <div class="brand-text">
                        <h1 class="main-title">Local AI Zone</h1>
                        <p class="subtitle">Direct Access to GGUF Models for Local LLMs</p>
                    </div>
                </div>
            </header>
            
            <!-- Statistics Section -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" id="model-count">40,000+</div>
                    <div class="stat-label">GGUF Models</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">Daily</div>
                    <div class="stat-label">Updates</div>
                </div>
            </div>
            
            <!-- Compatibility Section -->
            <div class="compatibility-section">
                <div class="compatibility-label">Compatible with:</div>
                <div class="compatibility-tools">
                    <span class="tool-badge">llama.cpp</span>
                    <span class="tool-badge">LM Studio</span>
                    <span class="tool-badge">Ollama</span>
                    <span class="tool-badge">GGUF Loader</span>
                </div>
            </div>
            
            <!-- Footer Attribution -->
            <footer class="banner-footer">
                <div class="attribution">
                    <span class="powered-by">Powered by</span>
                    <span class="gguf-loader">GGUF Loader</span>
                </div>
            </footer>
        </div>
        
        <!-- Decorative Elements -->
        <div class="decorative-elements">
            <div class="floating-icon icon-1">🤖</div>
            <div class="floating-icon icon-2">⚡</div>
            <div class="floating-icon icon-3">🔥</div>
        </div>
    </div>
<script src="/js/goatcounter.js" defer></script>

    <!-- Floating Instagram Button - Always Visible -->
    <a href="https://www.instagram.com/nazary.ai" class="floating-instagram-btn" rel="noopener" target="_blank" aria-label="Connect with me on Instagram" title="Connect with me on Instagram" style="position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; text-decoration: none; border-radius: 50px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 8px 24px rgba(225, 48, 108, 0.4); z-index: 1000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid rgba(255, 255, 255, 0.2);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span style="color: white; font-weight: 600; white-space: nowrap;">Connect with me on Instagram</span>
    </a>
</body>
</html>
